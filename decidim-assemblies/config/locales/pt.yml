    help:
      participatory_spaces:
        assemblies:
          contextual: "<p>Uma <strong>assembleia</strong> é um grupo de membros de uma organização que se reúne periodicamente para tomar decisões sobre uma área ou escopo específico da organização.</p> <p>As assembleias realizam reuniões, algumas são privadas e outras abertas. Se forem abertas, é possível participar nelas (por exemplo: assistir se a capacidade permitir, adicionar pontos à agenda ou comentar as propostas e decisões tomadas por este órgão).</p> <p>Exemplos: Uma assembleia geral (que se reúne uma vez por ano para definir as principais linhas de ação da organização, bem como os seus órgãos executivos por votação), um conselho consultivo de igualdade (que se reúne a cada dois meses para fazer propostas sobre como melhorar as relações de género na organização), uma comissão de avaliação (que se reúne todos os meses para monitorizar um processo) ou um órgão de garantia (que recolhe incidentes, abusos ou propostas para melhorar os procedimentos de tomada de decisão) são todos exemplos de assembleias.</p>\n"
          page: "<p>Uma <strong>assembleia</strong> é um grupo de membros de uma organização que se reúne periodicamente para tomar decisões sobre uma área ou escopo específico da organização.</p> <p>As assembleias realizam reuniões, algumas são privadas e outras abertas. Se forem abertas, é possível participar nelas (por exemplo: assistir se a capacidade permitir, adicionar pontos à agenda ou comentar as propostas e decisões tomadas por este órgão).</p> <p>Exemplos: Uma assembleia geral (que se reúne uma vez por ano para definir as principais linhas de ação da organização, bem como os seus órgãos executivos por votação), um conselho consultivo de igualdade (que se reúne a cada dois meses para fazer propostas sobre como melhorar as relações de género na organização), uma comissão de avaliação (que se reúne todos os meses para monitorizar um processo) ou um órgão de garantia (que recolhe incidentes, abusos ou propostas para melhorar os procedimentos de tomada de decisão) são todos exemplos de assembleias.</p>\n"
          title: O que são assembleias?
