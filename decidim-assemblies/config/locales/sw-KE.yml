    help:
      participatory_spaces:
        assemblies:
          contextual: "<p>Mkutano</strong> ni kundi la wanachama wa shirika ambao hukutana mara kwa mara ili kufanya maamuzi kuhusu eneo au upeo mahususi wa shirika.</p> <p>Mikutano hufanya mikutano, mingine ni ya faragha. na zingine ziko wazi. Ikiwa zimefunguliwa, inawezekana kushiriki katika hizo (kwa mfano: kuhudhuria ikiwa uwezo unaruhusu, kuongeza pointi kwenye ajenda, au kutoa maoni juu ya mapendekezo na maamuzi yaliyochukuliwa na chombo hiki).</p> <p>Mifano : Mkutano mkuu (ambao hukutana mara moja kwa mwaka ili kufafanua mienendo mikuu ya shughuli za shirika pamoja na vyombo vyake vya utendaji kwa kura), baraza la ushauri la usawa (ambalo hukutana kila baada ya miezi miwili kufanya mapendekezo ya jinsi ya kuboresha mahusiano ya kijinsia katika shirika), tume ya tathmini (ambayo hukutana kila mwezi kufuatilia mchakato) au shirika la dhamana (ambalo hukusanya matukio, dhuluma au mapendekezo ya kuboresha taratibu za kufanya maamuzi) yote ni mifano ya makusanyiko. </p>"
          page: "<p>Mkutano</strong> ni kundi la wanachama wa shirika ambao hukutana mara kwa mara ili kufanya maamuzi kuhusu eneo au upeo mahususi wa shirika.</p> <p>Mikutano hufanya mikutano, mingine ni ya faragha. na zingine ziko wazi. Ikiwa zimefunguliwa, inawezekana kushiriki katika hizo (kwa mfano: kuhudhuria ikiwa uwezo unaruhusu, kuongeza pointi kwenye ajenda, au kutoa maoni juu ya mapendekezo na maamuzi yaliyochukuliwa na chombo hiki).</p> <p>Mifano : Mkutano mkuu (ambao hukutana mara moja kwa mwaka ili kufafanua mienendo mikuu ya shughuli za shirika pamoja na vyombo vyake vya utendaji kwa kura), baraza la ushauri la usawa (ambalo hukutana kila baada ya miezi miwili kufanya mapendekezo ya jinsi ya kuboresha mahusiano ya kijinsia katika shirika), tume ya tathmini (ambayo hukutana kila mwezi kufuatilia mchakato) au shirika la dhamana (ambalo hukusanya matukio, dhuluma au mapendekezo ya kuboresha taratibu za kufanya maamuzi) yote ni mifano ya makusanyiko. </p>"
