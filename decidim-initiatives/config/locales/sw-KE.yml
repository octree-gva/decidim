    help:
      participatory_spaces:
        initiatives:
          contextual: "<p>Mpango</strong> ni pendekezo ambalo linaweza kukuzwa na mtu yeyote kwa hiari yake mwenyewe (bila kutegemea vituo vingine au nafasi za ushiriki) kupitia ukusanyaji wa sahihi (za kidijitali) ili shirika litekeleze shughuli mahususi. hatua (rekebisha kanuni, anzisha mradi, badilisha jina la idara au mtaa, n.k.).</p> <p>Waendelezaji wa mpango huo wanaweza kufafanua mpango wake. malengo, kukusanya usaidizi, mjadala, kuisambaza na kufafanua pointi za mkutano ambapo saini zinaweza kukusanywa kutoka kwa waliohudhuria au mijadala iliyo wazi kwa washiriki wengine.</p> <p>Mifano: Mpango unaweza kukusanya saini ili kuitisha mashauriano kati ya watu wote. ya shirika, au kuunda au kuitisha mkutano, au kuanzisha mchakato wa kuongeza bajeti kwa eneo au eneo la shirika. Wakati wa mchakato wa kukusanya saini, watu zaidi wanaweza kuongeza mahitaji haya na kuyapeleka mbele katika shirika.</p>"
          page: "<p>Mpango</strong> ni pendekezo ambalo linaweza kukuzwa na mtu yeyote kwa hiari yake mwenyewe (bila kutegemea vituo vingine au nafasi za ushiriki) kupitia ukusanyaji wa sahihi (za kidijitali) ili shirika litekeleze shughuli mahususi. hatua (rekebisha kanuni, anzisha mradi, badilisha jina la idara au mtaa, n.k.).</p> <p>Waendelezaji wa mpango huo wanaweza kufafanua mpango wake. malengo, kukusanya usaidizi, mjadala, kuisambaza na kufafanua pointi za mkutano ambapo saini zinaweza kukusanywa kutoka kwa waliohudhuria au mijadala iliyo wazi kwa washiriki wengine.</p> <p>Mifano: Mpango unaweza kukusanya saini ili kuitisha mashauriano kati ya watu wote. ya shirika, au kuunda au kuitisha mkutano, au kuanzisha mchakato wa kuongeza bajeti kwa eneo au eneo la shirika. Wakati wa mchakato wa kukusanya saini, watu zaidi wanaweza kuongeza mahitaji haya na kuyapeleka mbele katika shirika.</p>"
          title: Mipango ni nini?
