            <p>
              Organização criada com sucesso.
            </p>
            <ol>
              <li>Poderás precisar de atualizar o código da tua aplicação para permitir pedidos para %{host}. Adiciona o seguinte à configuração do ambiente (por exemplo, <code>config/environment/production.rb</code>) ou ao teu <code>config/application.rb</code>:
                <p> config.hosts << "%{host}" </p>
              </li>
