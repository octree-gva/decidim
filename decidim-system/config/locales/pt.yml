        csp_settings:
          connect_src: Connect src
          connect_src_hint: |
            A diretiva connect-src restringe os URLs que podem ser carregados usando elementos <script>. 
            A plataforma adicionará 'self', mas permite que adiciones mais. Deixa em branco se não tiveres certeza.
          default_src: Default src
          default_src_hint: |
            A diretiva default-src é a política padrão para carregar conteúdo como JavaScript, Imagens, CSS, Fontes, pedidos AJAX, Frames e Media HTML5.
            A plataforma adicionará "'self' 'unsafe-inline'", mas permite que adiciones mais. Deixa em branco se não tiveres certeza.
          font_src: Font src
          font_src_hint: |
            A diretiva font-src restringe os URLs que podem ser carregados usando @font-face.
            A plataforma adicionará 'self', mas permite que adiciones mais. Deixa em branco se não tiveres certeza.
          frame_src: Frame src
          frame_src_hint: |
            A diretiva frame-src restringe os URLs que podem ser carregados usando elementos <frame>, <iframe> e <object>. 
            A plataforma adicionará 'self', mas permite adicionar mais. Deixa em branco se não tens certeza.
          img_src: Img src
          img_src_hint: |
            A diretiva img-src restringe os URLs que podem ser carregados usando elementos <img>, <image>, <picture> e <svg>. 
            A plataforma adicionará 'self', mas permite adicionar mais. Deixa em branco se não tens certeza.
          media_src: Media src
          media_src_hint: |
            A diretiva media-src restringe os URLs que podem ser carregados usando os elementos <video>, <audio> e <source>. 
            A plataforma adicionará 'self', mas permite adicionar mais. Deixa em branco se não tens certeza.
          script_src: Script src
          script_src_hint: |
            A diretiva script-src restringe os URLs que podem ser carregados usando elementos <script>. 
            A plataforma adicionará "'self' 'unsafe-inline' 'unsafe-eval'", mas permite adicionar mais. Deixa em branco se não tens certeza.
          style_src: Style src
          style_src_hint: |
            A diretiva style-src restringe os URLs que podem ser carregados usando elementos <style>. 
            A plataforma adicionará "'self' 'unsafe-inline'", mas permite adicionar mais. Deixa em branco se não tens certeza.
