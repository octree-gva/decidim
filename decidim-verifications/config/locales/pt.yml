    authorization_handlers:
      admin:
        another_dummy_authorization_handler:
          help:
            - Um exemplo de manipulador de autorizações para que os desenvolvedores compreendam como funciona uma verificação simples.
            - Destina-se a desenvolvedores para que possam entender como implementar o seu próprio sistema de verificação.
            - Obter verificação introduzindo um número de passaporte começando com "A".
        csv_census:
          help:
            - Os administradores carregam um CSV com os emails dos participantes aceites.
            - Apenas participantes com um email nesse ficheiro CSV podem ser verificados.
        default:
          help:
            - A ajuda do manipulador de autorizações não está definida.
            - Um desenvolvedor precisa de definir a ajuda na chave de tradução (i18n) "%{authorization_handler}"
        dummy_authorization_handler:
          help:
            - Um exemplo de manipulador de autorizações para que os desenvolvedores compreendam como funciona uma verificação simples.
            - Destina-se a desenvolvedores para que possam entender como implementar o seu próprio sistema de verificação.
            - Obter verificação introduzindo um número de documento terminado com "X".
        id_documents:
          help:
            - Os participantes preenchem as suas informações de identidade e enviam uma cópia do seu documento.
            - Preencha as informações presentes na imagem enviada.
            - A informação deve corresponder ao que o utilizador preencheu.
            - Se não conseguires visualizar claramente a informação ou se não conseguires verificar, podes rejeitar o pedido, e o participante poderá corrigir.
        postal_letter:
          help:
            - Os participantes solicitam que um código de verificação seja enviado para o seu endereço.
            - Envia a carta para o seu endereço com o código de verificação.
            - Marca a carta como enviada.
            - Depois de marcar a carta como enviada, o participante poderá introduzir o código e ser verificado.
        sms:
          help:
            - Os participantes solicitam um código de verificação que será enviado para o telemóvel.
            - Eles precisam de introduzir o código para serem verificados.
            - Se não receberem o código, podem solicitá-lo novamente.
