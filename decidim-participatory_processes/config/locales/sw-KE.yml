    help:
      participatory_spaces:
        participatory_processes:
          contextual: "<p>Mchakato shirikishi</strong> ni mfuatano wa shughuli shirikishi (k.m. kwanza kujaza utafiti, kisha kutoa mapendekezo, kuyajadili ana kwa ana au mikutano ya mtandaoni, na hatimaye kuyapa kipaumbele) na lengo la kufafanua na kufanya uamuzi juu ya mada maalum.</p> <p>Mifano ya michakato shirikishi ni: mchakato wa kuchagua wajumbe wa kamati (ambapo wagombea huwasilishwa kwanza, kisha kujadiliwa na hatimaye mgombea kuchaguliwa), bajeti shirikishi (ambapo mapendekezo yanatolewa, yanathaminiwa kiuchumi na kupigiwa kura kwa fedha zilizopo), mchakato wa kupanga mikakati, utayarishaji shirikishi wa kanuni au kanuni, muundo wa eneo la mijini au utengenezaji wa mpango wa sera ya umma.</p>"
          page: "<p>Mchakato shirikishi</strong> ni mfuatano wa shughuli shirikishi (k.m. kwanza kujaza utafiti, kisha kutoa mapendekezo, kuyajadili ana kwa ana au mikutano ya mtandaoni, na hatimaye kuyapa kipaumbele) na lengo la kufafanua na kufanya uamuzi juu ya mada maalum.</p> <p>Mifano ya michakato shirikishi ni: mchakato wa kuchagua wajumbe wa kamati (ambapo wagombea huwasilishwa kwanza, kisha kujadiliwa na hatimaye mgombea kuchaguliwa), bajeti shirikishi (ambapo mapendekezo yanatolewa, yanathaminiwa kiuchumi na kupigiwa kura kwa fedha zilizopo), mchakato wa kupanga mikakati, utayarishaji shirikishi wa kanuni au kanuni, muundo wa eneo la mijini au utengenezaji wa mpango wa sera ya umma.</p>"
          title: Mchakato shirikishi ni upi?
